<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LocalSift</title>
<style>
    /* ========== DARK THEME — minimal, blue/gray, system fonts ========== */
    :root {
        --bg: #0b1220;          /* page background */
        --panel: #101a2e;       /* panels */
        --panel-2: #0d1526;     /* inner surfaces */
        --line: #1e2a44;        /* borders */
        --line-strong: #2a3a5c;
        --ink: #e2e8f0;         /* primary text */
        --muted: #7c8ba1;       /* secondary text */
        --accent: #3b82f6;      /* action blue */
        --accent-hover: #2f6fe0;
        --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PT Sans", Roboto, "DejaVu Sans", "Noto Sans", sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--ink);
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    /* ========== HEADER ========== */
    .topbar {
        display: flex;
        align-items: baseline;
        gap: 12px;
        padding: 14px 22px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        flex-shrink: 0;
    }
    .brand {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.2px;
    }
    .brand .logo-mark { color: var(--accent); margin-right: 6px; }
    .tagline { font-size: 12.5px; color: var(--muted); }

    /* ========== THREE-COLUMN LAYOUT (files / preview / chat) ========== */
    .layout {
        flex: 1;
        display: grid;
        grid-template-columns: 250px minmax(300px, 1fr) 440px;
        gap: 16px;
        padding: 16px 20px;
        overflow: hidden;
        min-height: 0;
    }
    /* preview hidden: clean two-column layout, the chat takes the space */
    .layout.no-preview { grid-template-columns: 250px 1fr; }
    .layout.no-preview .preview-col { display: none; }
    @media (max-width: 1100px) {
        .layout { grid-template-columns: 1fr; overflow-y: auto; }
        .preview-col, .right-col { max-height: 70vh; }
    }
    /* every column is a raised panel for depth */
    .col-panel {
        background: var(--panel);
        border: 1px solid var(--line-strong);
        border-radius: 14px;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 0;
        box-shadow: 0 2px 12px rgba(0, 0, 0, .30);
    }

    /* ========== LEFT COLUMN — DRAG & DROP ========== */
    .left-col {
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-height: 0;
    }
    .col-title {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--muted);
    }
    .dropzone {
        border: 2px dashed var(--line-strong);
        border-radius: 14px;
        background: var(--panel-2);
        padding: 26px 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        text-align: center;
        cursor: pointer;
        transition: border-color .15s, background .15s;
    }
    .dropzone:hover { border-color: var(--accent); background: #101c36; }
    .dz-icon {
        width: 46px;
        height: 46px;
        border-radius: 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        color: var(--accent);
    }
    .dz-title { font-size: 14px; font-weight: 600; }
    .dz-hint { font-size: 12px; color: var(--muted); }

    /* loaded file list */
    .file-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 6px;
        overflow-y: auto;
        overscroll-behavior: contain;
        min-height: 0;
        flex: 1;
    }
    .file-list .empty {
        font-size: 12.5px;
        color: var(--muted);
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel-2);
    }
    .file-card {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 9px 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel-2);
        cursor: pointer;
        transition: border-color .15s;
    }
    .file-card:hover { border-color: var(--accent); }
    .file-card .fc-icon { font-size: 16px; flex-shrink: 0; }
    .file-card .fc-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .file-card .fc-name { font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-card .fc-meta { font-size: 11px; color: var(--muted); }
    .clear-btn {
        font-family: inherit;
        font-size: 11px;
        color: var(--muted);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 7px;
        width: 22px; height: 22px;
        cursor: pointer;
        flex-shrink: 0;
        display: inline-flex; align-items: center; justify-content: center;
    }
    .clear-btn:hover { color: #fff; background: var(--accent-hover); border-color: var(--accent-hover); }

    /* ========== CENTER COLUMN — DOCUMENT PREVIEW ========== */
    .preview-empty {
        margin: auto;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
        padding: 20px;
    }
    .preview-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
        font-size: 13px;
        font-weight: 600;
        border-bottom: 1px solid var(--line);
        padding-bottom: 8px;
    }
    .preview-head .preview-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .preview-head .preview-meta { font-size: 11px; color: var(--muted); flex-shrink: 0; }
    .preview-text {
        flex: 1;
        overflow-y: auto;
        overscroll-behavior: contain;
        font-size: 12.5px;
        line-height: 1.65;
        color: var(--ink);
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 14px;
        white-space: pre-wrap;
        word-wrap: break-word;
    }

    /* ========== CITATIONS — expandable accordions under AI answers ========== */
    .citations, .rag-results { display: flex; flex-direction: column; gap: 6px; align-self: stretch; margin-top: -6px; }
    .rag-header { font-size: 12px; color: var(--muted); }
    details.citation-box {
        border: 1px solid var(--line);
        background: var(--panel-2);
        border-radius: 10px;
        font-size: 11.5px;
        color: var(--muted);
        overflow: hidden;
    }
    details.citation-box summary {
        cursor: pointer;
        padding: 7px 10px;
        font-weight: 600;
        list-style: none;
        display: flex;
        gap: 6px;
        align-items: center;
        user-select: none;
    }
    details.citation-box summary::-webkit-details-marker { display: none; }
    details.citation-box summary::before { content: '▸'; transition: transform .15s; color: var(--accent); }
    details.citation-box[open] summary::before { transform: rotate(90deg); }
    details.citation-box .chunk-text {
        padding: 8px 10px;
        border-top: 1px solid var(--line);
        line-height: 1.6;
        color: var(--ink);
        font-size: 12px;
        white-space: pre-wrap;
        max-height: 170px;
        overflow-y: auto;
    }
    /* grouped sources: ranked fragments inside one accordion */
    details.sources-group .frag-item { padding: 0 2px; }
    .frag-meta { font-size: 11px; font-weight: 600; color: var(--muted); padding: 6px 10px 2px; }
    /* highlighted query terms inside citations (BM25 transparency) */
    mark { background: #ffd54f; color: #101a2e; border-radius: 3px; padding: 0 2px; }

    /* ========== CHAT OPTIONS (Search Only) & SIDEBAR TOP-K ========== */
    .chat-options { display: flex; justify-content: flex-end; }
    .mode-toggle {
        display: flex; align-items: center; gap: 6px;
        font-size: 11.5px; color: var(--muted);
        cursor: pointer; user-select: none;
    }
    .mode-toggle input { accent-color: var(--accent); cursor: pointer; }
    .topk-row {
        display: flex; justify-content: space-between; align-items: center;
        font-size: 11.5px; color: var(--muted);
    }
    .topk-row select {
        font-family: inherit; font-size: 11.5px;
        color: var(--ink); background: var(--panel-2);
        border: 1px solid var(--line-strong);
        border-radius: 7px; padding: 3px 6px; cursor: pointer;
    }
    .input-bar button.stop { background: #dc2626; box-shadow: 0 2px 10px rgba(220, 38, 38, .35); }
    .input-bar button.stop:hover { background: #b91c1c; }

    /* ========== RIGHT COLUMN — CHAT ========== */
    .right-col {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 0;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px;
    }
    .chat {
        flex: 1;
        overflow-y: auto;
        overscroll-behavior: contain;   /* trackpad scroll stays inside the chat */
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 0;
    }
    .empty-chat {
        margin: auto;
        text-align: center;
        color: var(--muted);
        display: flex;
        flex-direction: column;
        gap: 6px;
    }
    .empty-chat .title { font-size: 15px; font-weight: 600; color: var(--ink); }
    .empty-chat .sub { font-size: 12.5px; }

    /* messages (structure ready for future logic) */
    .msg {
        max-width: 82%;
        padding: 10px 14px;
        border-radius: 12px;
        font-size: 14px;
        line-height: 1.55;
    }
    .msg.user {
        align-self: flex-end;
        background: var(--accent);
        color: #fff;
        border-bottom-right-radius: 4px;
    }
    .msg.assistant {
        align-self: flex-start;
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-bottom-left-radius: 4px;
    }

    /* ========== INPUT BAR — BOTTOM RIGHT ========== */
    .input-bar {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        flex-shrink: 0;
    }
    .input-bar textarea {
        flex: 1;
        resize: none;
        font-family: inherit;
        font-size: 14px;
        color: var(--ink);
        background: var(--panel-2);
        border: 1px solid var(--line-strong);
        border-radius: 12px;
        padding: 11px 14px;
        outline: none;
        transition: border-color .15s;
        min-height: 46px;
        max-height: 140px;
    }
    .input-bar textarea:focus { border-color: var(--accent); }
    .input-bar textarea::placeholder { color: var(--muted); }
    .input-bar button {
        font-family: inherit;
        font-size: 14px;
        font-weight: 700;
        color: #fff;
        background: var(--accent);
        border: none;
        border-radius: 12px;
        padding: 12px 20px;
        cursor: pointer;
        transition: background .15s, box-shadow .15s;
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        box-shadow: 0 2px 10px rgba(59, 130, 246, .30);
    }
    .input-bar button .btn-icon { font-size: 14px; }
    .input-bar button:hover { background: var(--accent-hover); }
    .input-bar button:active { transform: translateY(1px); }

    /* ========== HEADER CONTROLS (model settings) ========== */
    .topbar { justify-content: space-between; }
    .topbar-left { display: flex; align-items: baseline; gap: 12px; }
    .header-controls { display: flex; gap: 8px; align-items: center; }
    .hdr-icon {
        font-size: 15px; cursor: pointer;
        width: 34px; height: 34px; border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--panel-2); color: var(--ink);
        display: inline-flex; align-items: center; justify-content: center;
    }
    .hdr-icon:hover { border-color: var(--accent); }
    .hdr-icon.inactive { opacity: .45; }

    /* ========== UPLOAD STATES & FILE LIST ========== */
    .dropzone.drag { border-color: var(--accent); background: #101c36; }
    .file-item {
        display: flex; justify-content: space-between; gap: 8px; align-items: center;
        font-size: 12.5px; padding: 9px 12px;
        border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2);
    }
    .file-item .fi-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-item .fi-meta { color: var(--muted); flex-shrink: 0; }
    .status { font-size: 11.5px; color: var(--muted); min-height: 15px; }
    .typing-cursor { display: inline-block; animation: blink 1s step-start infinite; opacity: .6; }
    @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>

    <header class="topbar">
        <div class="topbar-left">
            <div class="brand"><span class="logo-mark">⌖</span>LocalSift</div>
            <span class="tagline">local file analysis</span>
        </div>
        <div class="header-controls">
            <button class="hdr-icon" id="preview-toggle" title="Show document preview">📄</button>
            <button class="hdr-icon" id="settings-btn" title="Model settings">⚙️</button>
        </div>
    </header>

    <main class="layout">

        <!-- ===== LEFT COLUMN: FILES ===== -->
        <section class="left-col col-panel">
            <div class="col-title">Files</div>
            <div class="dropzone" id="dropzone">
                <div class="dz-icon">⇪</div>
                <p class="dz-title">Drag &amp; drop your files here</p>
                <p class="dz-hint">PDF, TXT, MD, CSV, ODT, DOCX</p>
            </div>
            <input type="file" id="file-input" hidden accept=".txt,.md,.csv,.odt,.docx,.pdf">
            <ul class="file-list" id="file-list">
                <li class="empty">No files loaded</li>
            </ul>
            <div class="status" id="status"></div>
            <div class="topk-row">
                <label for="topk-select">Fragments sent to AI</label>
                <select id="topk-select">
                    <option>1</option>
                    <option>2</option>
                    <option selected>3</option>
                    <option>4</option>
                    <option>5</option>
                </select>
            </div>
        </section>

        <!-- ===== CENTER COLUMN: DOCUMENT PREVIEW ===== -->
        <section class="preview-col col-panel">
            <div class="col-title">Document preview</div>
            <div class="preview-empty" id="preview-empty">Load a file to inspect the extracted text. Click a file on the left to switch preview.</div>
            <div class="preview-head" id="preview-head" hidden>
                <span class="preview-name" id="preview-name"></span>
                <span class="preview-meta" id="preview-meta"></span>
            </div>
            <div class="preview-text" id="preview-text" hidden></div>
        </section>

        <!-- ===== RIGHT COLUMN: CHAT ===== -->
        <section class="right-col col-panel">
            <div class="chat" id="chat">
                <div class="empty-chat">
                    <div class="title">LocalSift is ready</div>
                    <div class="sub">Drop files on the left, then ask your question below.</div>
                </div>
                <!-- messages (.msg.user / .msg.assistant) will appear here -->
            </div>
            <div class="chat-options">
                <label class="mode-toggle" title="Skip the AI: show the BM25 fragments directly — fast on slow PCs and great for exact-word search">
                    <input type="checkbox" id="search-only">
                    <span>Search Only (No AI)</span>
                </label>
            </div>
            <div class="input-bar">
                <textarea id="prompt" rows="1" placeholder="Ask something about your files…"></textarea>
                <button id="sift-btn" type="button"><span class="btn-icon">🔍</span>Sift</button>
            </div>
        </section>

    </main>

    <script>
        // ===================== STATE =====================
        const documents = [];   // [{ name, text, paragraphs }]
        const DEFAULT_MODEL = 'qwen2.5:1.5b';
        let BACKEND = { type: 'koboldcpp', url: 'http://localhost:5001/v1/chat/completions' };

        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('file-input');
        const fileListEl = document.getElementById('file-list');
        const statusEl = document.getElementById('status');
        const chatEl = document.getElementById('chat');
        const promptEl = document.getElementById('prompt');
        const siftBtn = document.getElementById('sift-btn');
        const searchOnlyEl = document.getElementById('search-only');
        const topkSelect = document.getElementById('topk-select');

        function setStatus(text) { statusEl.textContent = text || ''; }
        function getModelName() { return localStorage.getItem('localsift_model') || DEFAULT_MODEL; }

        // ===================== CHAT RENDERING =====================
        function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
        // Auto-scroll ONLY when the user is already near the bottom:
        // never fights manual trackpad/mouse scrolling.
        function autoScroll() {
            const nearBottom = chatEl.scrollHeight - chatEl.scrollTop - chatEl.clientHeight < 80;
            if (nearBottom) chatEl.scrollTop = chatEl.scrollHeight;
        }
        function removeEmptyState() { const el = chatEl.querySelector('.empty-chat'); if (el) el.remove(); }
        // source accordions under the AI answer: the exact BM25 chunks, with the
        // query terms highlighted — full transparency of what the model saw
        function highlightQuery(text, query) {
            const qTokens = new Set(tokenize(query));
            return text.split(/([\p{L}\p{N}]+)/u).map(part =>
                qTokens.has(part.toLowerCase()) ? `<mark>${escapeHtml(part)}</mark>` : escapeHtml(part)
            ).join('');
        }
        // One grouped accordion per answer: all fragments ranked by BM25 score,
        // each showing file, paragraph, score and the highlighted chunk
        function sourcesGroup(query, fragments, open) {
            const items = fragments.map((f, i) => `
                <div class="frag-item">
                    <div class="frag-meta">#${i + 1} ${escapeHtml(f.doc)} — Paragraph ${f.index + 1} — Score: ${f.score.toFixed(1)}</div>
                    <div class="chunk-text">${highlightQuery(f.text, query)}</div>
                </div>`).join('');
            return `<details class="citation-box sources-group"${open ? ' open' : ''}>
                <summary>📄 ${fragments.length} source${fragments.length === 1 ? '' : 's'} used (click to expand)</summary>
                ${items}
            </details>`;
        }
        function appendCitations(replyDiv, fragments, query) {
            if (!fragments.length) return;
            const cite = document.createElement('div');
            cite.className = 'citations';
            cite.innerHTML = sourcesGroup(query, fragments, false);
            replyDiv.insertAdjacentElement('afterend', cite);
        }
        // Search Only mode: show the BM25 fragments directly, no LLM call
        function renderSearchResults(query, fragments) {
            const header = appendMessage('assistant', `BM25 search — top ${fragments.length} fragment${fragments.length === 1 ? '' : 's'} for “${query}” (no AI called):`);
            header.classList.add('rag-header');
            const wrap = document.createElement('div');
            wrap.className = 'rag-results';
            wrap.innerHTML = sourcesGroup(query, fragments, true);
            chatEl.appendChild(wrap);
            autoScroll();
        }

        // Top-K: how many fragments to send to the AI (persisted)
        function getTopK() { return Number(topkSelect.value) || 3; }
        topkSelect.value = localStorage.getItem('localsift_topk') || '3';
        topkSelect.addEventListener('change', () => localStorage.setItem('localsift_topk', topkSelect.value));

        // streaming state: turns the Sift button into a red Stop button
        let streaming = false;
        let streamAbort = null;
        function setStreaming(on) {
            streaming = on;
            siftBtn.classList.toggle('stop', on);
            siftBtn.innerHTML = on ? '<span class="btn-icon">⏹</span>Stop' : '<span class="btn-icon">🔍</span>Sift';
        }
        function appendMessage(role, content) {
            const el = document.createElement('div');
            el.className = `msg ${role}`;
            el.innerHTML = escapeHtml(content);
            removeEmptyState();
            chatEl.appendChild(el);
            autoScroll();
            return el;
        }

        // ===================== UPLOAD =====================
        function splitParagraphs(text) {
            return text.split(/\n{2,}/).map(p => p.replace(/\s+/g, ' ').trim()).filter(Boolean);
        }

        async function uploadFile(file) {
            setStatus(`Extracting text from ${file.name}…`);
            try {
                const fd = new FormData();
                fd.append('file', file);
                const res = await fetch('/upload', { method: 'POST', body: fd });
                const data = await res.json();
                if (!data.ok) { appendMessage('assistant', `⚠️ ${file.name}: ${data.error}`); setStatus(''); return; }
                const doc = { name: data.filename, size: data.size, text: data.text, paragraphs: splitParagraphs(data.text) };
                documents.push(doc);
                renderFileList();
                showPreview(doc);
                console.log(`[upload] ${data.filename}: ${data.chars} chars extracted`);
                setStatus(`${data.filename}: ${data.chars} chars ready`);
            } catch (err) {
                console.error('[upload] failed:', err);
                appendMessage('assistant', '⚠️ Could not reach the LocalSift server. Is start_localsift.sh running?');
                setStatus('');
            }
        }

        // file cards: icon + name + size + clear button; click a card to preview it
        const FILE_ICONS = { pdf: '📕', docx: '📘', odt: '📗', txt: '📄', md: '📄', csv: '📄' };
        function fileIcon(name) { return FILE_ICONS[name.split('.').pop().toLowerCase()] || '📄'; }
        function formatSize(bytes) { return bytes < 1024 ? `${bytes} B` : `${(bytes / 1024).toFixed(1)} KB`; }

        function renderFileList() {
            if (!documents.length) { fileListEl.innerHTML = '<li class="empty">No files loaded</li>'; return; }
            fileListEl.innerHTML = '';
            documents.forEach((doc, i) => {
                const li = document.createElement('li');
                li.className = 'file-card';
                li.title = 'Click to preview this file';
                li.innerHTML = `<span class="fc-icon">${fileIcon(doc.name)}</span>
                    <span class="fc-info">
                        <span class="fc-name">${escapeHtml(doc.name)}</span>
                        <span class="fc-meta">${formatSize(doc.size || 0)} · ${doc.paragraphs.length} ¶</span>
                    </span>
                    <button class="clear-btn" data-i="${i}" title="Remove file">✕</button>`;
                li.addEventListener('click', e => { if (!e.target.closest('.clear-btn')) showPreview(doc); });
                fileListEl.appendChild(li);
            });
            fileListEl.querySelectorAll('.clear-btn').forEach(btn => btn.addEventListener('click', e => {
                e.stopPropagation();
                const i = Number(btn.dataset.i);
                const removed = documents.splice(i, 1)[0];
                if (previewDoc === removed) clearPreview();
                renderFileList();
            }));
        }

        // document preview: first 500 characters of the extracted text
        let previewDoc = null;
        function showPreview(doc) {
            previewDoc = doc;
            document.getElementById('preview-empty').hidden = true;
            document.getElementById('preview-head').hidden = false;
            document.getElementById('preview-text').hidden = false;
            document.getElementById('preview-name').textContent = doc.name;
            document.getElementById('preview-meta').textContent = `${doc.text.length.toLocaleString()} chars`;
            document.getElementById('preview-text').textContent = doc.text.slice(0, 500) + (doc.text.length > 500 ? '…' : '');
        }
        function clearPreview() {
            previewDoc = null;
            document.getElementById('preview-empty').hidden = false;
            document.getElementById('preview-head').hidden = true;
            document.getElementById('preview-text').hidden = true;
        }

        // drag & drop + click-to-browse
        ['dragenter', 'dragover'].forEach(ev => dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.add('drag'); }));
        ['dragleave', 'drop'].forEach(ev => dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.remove('drag'); }));
        dropzone.addEventListener('drop', e => { if (e.dataTransfer.files[0]) uploadFile(e.dataTransfer.files[0]); });
        dropzone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', () => { if (fileInput.files[0]) uploadFile(fileInput.files[0]); fileInput.value = ''; });

        // ===================== BM25 RANKING =====================
        const STOPWORDS = new Set(['the', 'a', 'an', 'and', 'or', 'of', 'to', 'in', 'is', 'are', 'was', 'were', 'be', 'been', 'for', 'on', 'with', 'as', 'at', 'by', 'it', 'its', 'this', 'that', 'these', 'those', 'from', 'which', 'not', 'you', 'your', 'we', 'our']);
        function tokenize(text) {
            const tokens = text.toLowerCase().match(/[\p{L}\p{N}]+/gu) || [];
            return tokens.filter(t => t.length > 1 && !STOPWORDS.has(t));
        }
        // Classic BM25 (k1 = 1.5, b = 0.75) over the paragraphs of all loaded documents
        function bm25TopFragments(query, k = 3) {
            const k1 = 1.5, b = 0.75;
            const corpus = [];
            for (const doc of documents) {
                doc.paragraphs.forEach((text, i) => corpus.push({ doc: doc.name, index: i, text, tokens: tokenize(text) }));
            }
            if (!corpus.length) return [];
            const N = corpus.length;
            const avgdl = corpus.reduce((sum, c) => sum + c.tokens.length, 0) / N;
            const df = new Map();
            for (const c of corpus) for (const t of new Set(c.tokens)) df.set(t, (df.get(t) || 0) + 1);
            const queryTokens = tokenize(query);
            for (const c of corpus) {
                const tf = new Map();
                for (const t of c.tokens) tf.set(t, (tf.get(t) || 0) + 1);
                let score = 0;
                for (const t of queryTokens) {
                    const f = tf.get(t); if (!f) continue;
                    const n = df.get(t) || 0;
                    const idf = Math.log(1 + (N - n + 0.5) / (n + 0.5));
                    score += idf * (f * (k1 + 1)) / (f + k1 * (1 - b + b * (c.tokens.length / avgdl)));
                }
                c.score = score;
            }
            return corpus.sort((a, z) => z.score - a.score).slice(0, k);
        }

        // ===================== RAG PROMPT =====================
        function buildRagMessages(query) {
            const fragments = bm25TopFragments(query, getTopK());
            const fragmentsText = fragments.length
                ? fragments.map((f, i) => `[Fragment ${i + 1} — ${f.doc}, paragraph ${f.index + 1}]\n${f.text}`).join('\n\n')
                : '(no fragments available)';
            const systemPrompt =
                'You are an expert document analysis assistant. ' +
                'You must ALWAYS answer in English, regardless of the language of the provided text. ' +
                'Answer based EXCLUSIVELY on the provided fragments. ' +
                "If the answer is not present, respond: 'I could not find this information in the document'. " +
                'Cite the fragment used.\n\n' +
                'Fragments: ' + fragmentsText;
            return { messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: query }], fragments };
        }

        // ===================== BACKEND DETECT (Ollama / KoboldCpp) =====================
        async function detectBackend() {
            try {
                const res = await fetch('http://127.0.0.1:11434/', { signal: AbortSignal.timeout(1000) });
                if (res.ok) return { type: 'ollama', url: 'http://127.0.0.1:11434/v1/chat/completions' };
            } catch (e) {}
            try {
                const res = await fetch('http://127.0.0.1:5001/api/extra/version', { signal: AbortSignal.timeout(1000) });
                if (res.ok) return { type: 'koboldcpp', url: 'http://localhost:5001/v1/chat/completions' };
            } catch (e) {}
            return { type: 'none', url: null };
        }

        // SSE streaming: tokens appear as they are generated; supports abort
        async function chatStream(messages, msgDiv, signal) {
            const payload = { model: getModelName(), messages, stream: true };
            if (BACKEND.type === 'koboldcpp') { payload.max_tokens = 512; payload.temperature = 0.3; }
            const response = await fetch(BACKEND.url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
                signal
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let reply = '', buffer = '';
            try {
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();
                    for (const line of lines) {
                        const s = line.trim();
                        if (!s.startsWith('data:')) continue;
                        const item = s.slice(5).trim();
                        if (!item || item === '[DONE]') continue;
                        try { const delta = JSON.parse(item).choices?.[0]?.delta?.content; if (delta) reply += delta; } catch (e) { /* incomplete SSE chunk: skip */ }
                    }
                msgDiv.innerHTML = escapeHtml(reply) + '<span class="typing-cursor">▌</span>';
                autoScroll();
                }
            } catch (e) {
                if (e.name === 'AbortError') {  // user pressed Stop: keep the partial reply
                    msgDiv.innerHTML = escapeHtml(reply) || '⏹ Generation stopped.';
                    return reply;
                }
                throw e;
            }
            msgDiv.innerHTML = escapeHtml(reply);
            return reply;
        }

        // ===================== SEND =====================
        async function sendQuery() {
            const query = promptEl.value.trim();
            if (!query || streaming) return;
            promptEl.value = '';
            appendMessage('user', query);
            if (!documents.length) {
                appendMessage('assistant', 'Please load a document first: drag a file into the left panel.');
                return;
            }
            const { messages, fragments } = buildRagMessages(query);
            console.log('[rag] top fragments:', fragments.map(f => `${f.doc} ¶${f.index + 1} (score ${f.score.toFixed(2)})`).join(' | '));

            // Search Only: skip the LLM entirely and show the BM25 fragments
            if (searchOnlyEl.checked) { renderSearchResults(query, fragments); return; }

            setStreaming(true);
            setStatus(`Asking ${getModelName()} (${BACKEND.type})…`);
            const replyDiv = appendMessage('assistant', '');
            try {
                if (!BACKEND.url) { const b = await detectBackend(); if (b.url) BACKEND = b; }
                if (!BACKEND.url) throw new Error('No AI backend found (Ollama on port 11434 or KoboldCpp on port 5001)');
                streamAbort = new AbortController();
                await chatStream(messages, replyDiv, streamAbort.signal);
                appendCitations(replyDiv, fragments, query);
                setStatus('');
            } catch (err) {
                console.error('[chat] failed:', err);
                replyDiv.innerHTML = escapeHtml(`⚠️ ${err.message}`);
                setStatus('backend error');
            } finally {
                streamAbort = null;
                setStreaming(false);
                promptEl.focus();
            }
        }
        // while streaming the button acts as Stop (abort), otherwise as Sift (send)
        siftBtn.addEventListener('click', () => {
            if (streaming) { if (streamAbort) streamAbort.abort(); return; }
            sendQuery();
        });
        promptEl.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendQuery(); }
        });

        // ===================== MODEL SETTINGS =====================
        document.getElementById('settings-btn').addEventListener('click', () => {
            const name = window.prompt('Model name for the AI backend:\n(Ollama example: qwen2.5:1.5b — any name works for KoboldCpp)', getModelName());
            if (name !== null) {
                const clean = name.trim() || DEFAULT_MODEL;
                localStorage.setItem('localsift_model', clean);
                alert('Model set to: ' + clean);
            }
        });

        // ===================== PREVIEW TOGGLE =====================
        // The document preview is optional: hidden by default so the chat and
        // its citations stay the focus. One click brings it back (choice saved).
        const previewToggle = document.getElementById('preview-toggle');
        const layoutEl = document.querySelector('.layout');
        function applyPreview(visible) {
            layoutEl.classList.toggle('no-preview', !visible);
            previewToggle.classList.toggle('inactive', !visible);
            previewToggle.title = visible ? 'Hide document preview' : 'Show document preview';
        }
        applyPreview(localStorage.getItem('localsift_preview') === '1');
        previewToggle.addEventListener('click', () => {
            const visible = !layoutEl.classList.contains('no-preview');
            applyPreview(!visible);
            localStorage.setItem('localsift_preview', visible ? '0' : '1');
        });

        // ===================== INIT =====================
        (async () => {
            BACKEND = await detectBackend();
            setStatus(BACKEND.url ? `AI backend: ${BACKEND.type}` : 'No AI backend detected');
        })();
    </script>

</body>
</html>
